[package]
name = "autotrader-fortress"
version = "0.1.0"
edition = "2021"
description = "Deterministic risk firewall and adversarial simulator for a Solana paper/shadow trading agent"
license = "MIT"
publish = false

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "fortress-sim"
path = "src/bin/fortress_sim.rs"
