name: Autotrader Fortress

on:
  push:
    branches:
      - chatgpt/autotrader-fortress-v1
    paths:
      - 'autotrader-rust/**'
      - '.github/workflows/autotrader-fortress.yml'
  pull_request:
    paths:
      - 'autotrader-rust/**'
      - '.github/workflows/autotrader-fortress.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --manifest-path autotrader-rust/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path autotrader-rust/Cargo.toml --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --manifest-path autotrader-rust/Cargo.toml

      - name: Million-iteration adversarial simulation
        run: cargo run --release --manifest-path autotrader-rust/Cargo.toml --bin fortress-sim -- 1000000
